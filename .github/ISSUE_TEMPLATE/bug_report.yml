name: Bug report
description: Report a layout problem, crash, or broken feature
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        Please search [existing issues](https://github.com/bilalmlkdev/papora/issues) first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: The due date field accepted a date before the issue date.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The editor should reject a due date that precedes the issue date.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps are easiest to follow.
      placeholder: |
        1. Open https://papora.vercel.app
        2. Go to the editor
        3. Set an issue date of 5 July and a due date of 1 July
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or console errors
      description: Drag images in, or paste the browser console output.

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 18
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15

  - type: dropdown
    id: document
    attributes:
      label: Which document type is affected?
      options:
        - Invoice
        - Receipt
        - Landing page
        - Both documents
    validations:
      required: true
